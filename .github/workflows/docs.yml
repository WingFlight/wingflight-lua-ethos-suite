name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'bin/docs/**'
      - 'src/wfsuite/app/**'
      - 'src/wfsuite/i18n/en.json'
      - '.github/workflows/docs.yml'
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'bin/docs/**'
      - 'src/wfsuite/app/**'
      - 'src/wfsuite/i18n/en.json'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s bin/docs -p 'test_*.py'
      - run: python bin/docs/generate_menu_docs.py --check
      - run: python bin/docs/generate_menu_docs.py --update-index
      - run: git diff --exit-code -- docs/pages/README.md
