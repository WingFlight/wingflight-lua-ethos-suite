name: Create wfsuite-lua-ethos ZIP on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # The harness jobs are not written out here. The first job reads every
  # bin/*/*.ci.json, checks it, and passes the list on as a matrix, so adding a
  # harness adds its own .ci.json and script and leaves this file alone (#2585).
  harness-discover:
    name: Find the harness jobs
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prove the reader can go red
        run: python bin/ci/harnesses.py --self-test

      - name: Read the harness metadata
        id: discover
        run: python bin/ci/harnesses.py --github-output

  harness:
    name: ${{ matrix.name }}
    needs: harness-discover
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.harness-discover.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: ${{ matrix.step }}
        run: lua5.4 ${{ matrix.script }}

      # The Setup Wizard holds the setup state, mixer inputs and servos with
      # timed overrides (API 22.14) and relies on lib/override_keepalive.lua to keep
      # them alive and to stop sending once they are released, so a radio that is
      # switched off lets the flight controller drop them. This pins the wire format
      # of the mode, servo and mixer override writes against msp.c and the keepalive's
      # refresh and release behaviour.
      - name: Check the timed bench overrides
        if: success() || failure()
        run: lua5.4 bin/tests/mode_override.lua

      # lib/setup_wizard_surfaces.lua is a port of the configurator's
      # src/tabs/setup_wizard/surfaces.js. The harness runs the configurator's own
      # test cases against it, so the two copies cannot drift apart unnoticed.
      - name: Check the Setup Wizard surface maths
        if: success() || failure()
        run: lua5.4 bin/tests/setup_wizard_surfaces.lua

      # The wizard moves the control surfaces from the radio. This drives the real
      # page and every step against the simulator's default glider mix and checks
      # what reaches the wire: the setup state held on open and released on every
      # way out, overrides and probes timed, nothing moved while armed, each step's
      # writes (alignment, RX map, mix, servo configs, motor protocol and a spin
      # that stops by itself, throws, mode and adjustment ranges, rates), Discard
      # writing back what was loaded, a restart that reopens the same step, and no
      # form built from an MSP reply.
      - name: Check the Setup Wizard page
        if: success() || failure()
        run: lua5.4 bin/tests/setup_wizard_page.lua

      # lib/setup_wizard_controls.lua and lib/setup_wizard_styles.lua port the
      # configurator's receiver.js, modeRanges.js, trimGain.js and styles.js. The
      # harness runs the configurator's own test cases against them.
      - name: Check the Setup Wizard radio controls and styles
        if: success() || failure()
        run: lua5.4 bin/tests/setup_wizard_controls.lua

      # lib/setup_wizard_mix.lua ports the configurator's Mixer.buildWizardRules().
      # The expected rules are the JS builder's own output for each airframe, so a
      # change on either side shows up here.
      - name: Check the Setup Wizard airframe mixes
        if: success() || failure()
        run: lua5.4 bin/tests/setup_wizard_mix.lua

  # Per-language PR builds (mirrors push.yml behavior)
  # Per-language PR builds (mirrors push.yml behavior)
  create-zip:
    name: Build PR ZIP (${{ matrix.lang }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # keep this in sync with push.yml (add/remove locales as needed)
        lang: [en, de, es, fr, it, nl, pt-br, no, cs, pl, he, zh-cn]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set build variables (PR version)
        run: |
          PR_NUMBER='${{ github.event.pull_request.number }}'
          echo "GIT_VER=PR-${PR_NUMBER}" >> $GITHUB_ENV

      - name: Create wingflight-lua-ethos-suite-${{ env.GIT_VER }}-${{ matrix.lang }}.zip
        run: |
          python bin/package/build_package.py \
            --lang '${{ matrix.lang }}' \
            --artifact-version '${{ env.GIT_VER }}' \
            --artifact-name 'wingflight-lua-ethos-suite-${{ env.GIT_VER }}-${{ matrix.lang }}.zip' \
            --output-dir .

      - name: Validate ETHOS package manifest
        run: |
          python bin/package/validate_ethos_manifest_zip.py \
            'wingflight-lua-ethos-suite-${{ env.GIT_VER }}-${{ matrix.lang }}.zip'

      - name: Upload per-locale ZIP
        uses: actions/upload-artifact@v4
        with:
          name: wingflight-lua-ethos-suite-${{ env.GIT_VER }}-${{ matrix.lang }}
          path: wingflight-lua-ethos-suite-${{ env.GIT_VER }}-${{ matrix.lang }}.zip
          if-no-files-found: error

  # tasks/elrs_sensors.lua's parseFrame() stops at the first appId it has no
  # decoder for and cannot skip it -- the pair's byte width lives only in
  # src/wfsuite/lib/elrs_sensor_table.lua. So one appId the table is missing
  # silently costs every sensor packed after it in the same frame, and the
  # symptom looks like a dead sensor. The table is compared against
  # wingflight-firmware's TLM_SENSOR(...) list, read at a pinned commit so a
  # firmware that adds an appId shows up here as a deliberate change.
  sensor-table-completeness:
    name: Sensor table completeness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prove the check can go red
        run: python bin/telemetry/verify_sensor_table.py --self-test

      - name: Check every broadcast appId has a decoder
        run: python bin/telemetry/verify_sensor_table.py

  # A string too wide for where it is shown is cut off on the radio: a form label
  # runs under its field, a menu tile label ends in "...". max_length caps a
  # translation at the English character count, which says nothing about pixels,
  # so German and Polish labels overflowed while passing it. check-fit.py measures
  # every locale's strings against the budget of the place each key is used, with
  # character widths measured on the X18 (the smallest screen).
  i18n-fit:
    name: i18n strings fit the X18
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prove the check can go red
        run: python bin/i18n/check-fit.py --self-test

      - name: Check every locale fits
        run: python bin/i18n/check-fit.py

  # The rule in .agents/rules/documentation.md asks that a change a pilot can observe
  # updates its page file in the same pull request, and that a pull request which needs
  # no documentation change says why. Nothing checked either half, so both rested on
  # the author remembering at the moment they are least likely to.
  #
  # The check is deliberately narrower than the rule says, because no static check can
  # decide what a pilot can observe: it asks nothing of a pull request that changes
  # nothing under src/, passes one that changes src/ and also docs/, and passes one
  # that changes src/ and no docs/ only if its body carries a `Documentation:` line of
  # its own. Whether that reason is a good one is the reviewer's call.
  documentation-rule:
    name: Documentation rule
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # the check diffs against the base commit, which a shallow clone does not carry
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prove the check can go red
        run: python bin/docs/verify_documentation_rule.py --self-test

      - name: Write the pull request body to a file
        # through the environment, never interpolated into the script: a pull request
        # body is text anybody can write
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > pr-body.txt

      - name: Check the documentation rule
        run: |
          python bin/docs/verify_documentation_rule.py \
            --base '${{ github.event.pull_request.base.sha }}' \
            --body-file pr-body.txt

  # A tag that does not resolve is shown on the radio as the raw text "@i18n(...)@",
  # and a hardcoded English label draws perfectly in every language, so neither
  # shows up in a build. check-tags.py fails when a @i18n tag in src/ has no key in
  # en.json. check_translations.py counts the literals that never reach the translator
  # and fails when that count grows past its baseline (71 on master, 2026-10-11): the
  # count is a ratchet, not a target, so the existing strings are reported rather than
  # blocking. --self-test proves the detector finds and keeps quiet where it should.
  i18n-tags:
    name: i18n tags resolve and no new hardcoded labels
    runs-on: ubuntu-latest
    # Read-only token: the checkers run code from the pull request.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prove the translation check can go red
        run: python bin/i18n/check_translations.py --self-test

      - name: Check every @i18n tag resolves against en.json
        run: python bin/i18n/check-tags.py

      - name: Check the untranslated-literal ratchet
        run: python bin/i18n/check_translations.py
